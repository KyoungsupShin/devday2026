<svg viewBox="0 0 1280 370" width="100%" role="img" aria-label="A2A coordinator handoff workflow" xmlns="http://www.w3.org/2000/svg">
<style>.node{fill:#fff;stroke:#8ab4f8;stroke-width:2}.work{fill:#f8fbff;stroke:#4285f4;stroke-width:2}.end{fill:#e6f4ea;stroke:#34a853;stroke-width:2}.label{font:600 15px Arial, Helvetica, sans-serif;fill:#202124}.small{font:13px Arial, Helvetica, sans-serif;fill:#5f6368}.edge{fill:none;stroke:#5f6368;stroke-width:2;marker-end:url(#rpt-arrow)}</style><defs><marker id="rpt-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5f6368"/></marker></defs>
