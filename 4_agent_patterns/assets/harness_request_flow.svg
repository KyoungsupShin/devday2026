<svg viewBox="0 0 1200 300" width="88%" style="display:block;margin:0 auto" role="img" aria-label="Sketch of business request processing sequence" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/>
  <style>.paper{fill:#fcfdff;stroke:#c6d8ec;stroke-width:2;stroke-dasharray:8 5}.bubble{fill:#fff;stroke:#4f6475;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.focus{fill:#f8fbff;stroke:#4285f4;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.review{fill:#fffaf0;stroke:#d99000;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.ink{font:14px Helvetica, sans-serif;fill:#263238}.note{font:14px Helvetica, sans-serif;fill:#546e7a}.line{fill:none;stroke:#4f6475;stroke-width:2.2;stroke-linecap:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#8b6fb0;stroke-width:2;stroke-dasharray:7 6;stroke-linecap:round}</style>
