<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 390" role="img" aria-labelledby="title description">
  <title id="title">Advanced A2A workflow</title>
  <desc id="description">A user request is orchestrated through A2A handoff, selected agents, task artifacts, middleware, and a response.</desc>
  <style>
    .surface { fill: #f8fbff; stroke: #d1deee; stroke-width: 2; }
    .node { fill: #fff; stroke: #8ab4f8; stroke-width: 2; }
    .work { fill: #f8fbff; stroke: #4285f4; stroke-width: 2; }
    .end { fill: #e6f4ea; stroke: #34a853; stroke-width: 2; }
    .support { fill: #fffdf5; stroke: #f9ab00; stroke-width: 2; }
    .codex { fill: #edf9f5; stroke: #10a37f; stroke-width: 2; }
    .label { font: 600 15px Arial, sans-serif; fill: #202124; }
    .small { font: 13px Arial, sans-serif; fill: #5f6368; }
    .edge { fill: none; stroke: #5f6368; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5f6368"/></marker>
  </defs>
  <rect x="12" y="12" width="1156" height="366" rx="18" class="surface"/>
  <text x="38" y="48" class="label" style="font-size:20px">Advanced A2A Workflow</text>
  <text x="38" y="72" class="small">Team handoff · task artifact · human review</text>

  <rect x="38" y="176" width="125" height="66" rx="12" class="node"/>
  <text x="100" y="204" text-anchor="middle" class="label">User request</text>
  <text x="100" y="225" text-anchor="middle" class="small">field request</text>

  <rect x="220" y="158" width="176" height="102" rx="12" class="work"/>
  <text x="308" y="194" text-anchor="middle" class="label">Orchestration</text>
  <text x="308" y="214" text-anchor="middle" class="label">Agent</text>
  <text x="308" y="239" text-anchor="middle" class="small">choose Team / Codex</text>

  <rect x="455" y="176" width="145" height="66" rx="12" class="work"/>
  <text x="527" y="204" text-anchor="middle" class="label">A2A Handoff</text>
  <text x="527" y="225" text-anchor="middle" class="small">message + envelope</text>

  <rect x="658" y="151" width="170" height="116" rx="12" class="node"/>
  <text x="743" y="187" text-anchor="middle" class="label">Selected A2A</text>
  <text x="743" y="207" text-anchor="middle" class="label">Agent</text>
  <text x="743" y="232" text-anchor="middle" class="small">Team or Codex</text>
  <text x="743" y="251" text-anchor="middle" class="small">task status updates</text>

  <rect x="885" y="176" width="135" height="66" rx="12" class="support"/>
  <text x="952" y="204" text-anchor="middle" class="label">Task artifact</text>
  <text x="952" y="225" text-anchor="middle" class="small">TextPart · DataPart</text>

  <rect x="1072" y="176" width="70" height="66" rx="12" class="end"/>
  <text x="1107" y="204" text-anchor="middle" class="label">Result</text>
  <text x="1107" y="225" text-anchor="middle" class="small">trace</text>

  <rect x="455" y="91" width="145" height="50" rx="10" class="support"/>
  <text x="527" y="113" text-anchor="middle" class="label">Grounding</text>
  <text x="527" y="131" text-anchor="middle" class="small">approval context</text>

  <rect x="658" y="303" width="170" height="48" rx="10" class="codex"/>
  <text x="743" y="324" text-anchor="middle" class="label">Codex App Server</text>
  <text x="743" y="342" text-anchor="middle" class="small">read-only SQL draft</text>

  <path d="M163 209 H220 M396 209 H455 M600 209 H658 M828 209 H885 M1020 209 H1072" class="edge"/>
  <path d="M396 180 C430 180 430 116 455 116" class="edge"/>
  <path d="M600 116 C625 116 625 180 658 180" class="edge"/>
  <path d="M743 267 V303" class="edge"/>
</svg>
