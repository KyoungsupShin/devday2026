<svg viewBox="0 0 1200 390" width="92%" style="display:block;margin:18px auto" role="img" aria-label="Comparative agent benchmark flow" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5f6b7a"/></marker></defs><style>.b{stroke:#5f6b7a;stroke-width:2;rx:10}.t{font:14px Helvetica, sans-serif;fill:#202124}.n{font:14px Helvetica, sans-serif;fill:#5f6368}.l{stroke:#5f6b7a;stroke-width:2;fill:none;marker-end:url(#a)}</style><text x="24" y="32" class="t" style="font-size:20px">Comparative Agent Benchmark Flow</text><text x="24" y="55" class="n">동일 task·동일 제약·동일 환경에서 후보 Agent와 기준 Agent를 비교합니다.</text><rect x="30" y="135" width="170" height="80" class="b" fill="#eef6ff"/><text x="115" y="166" text-anchor="middle" class="t">Benchmark Suite</text><text x="115" y="190" text-anchor="middle" class="n">task · rubric · policy</text><rect x="265" y="135" width="160" height="80" class="b" fill="#f1f3f4"/><text x="345" y="166" text-anchor="middle" class="t">Eval Runner</text><text x="345" y="190" text-anchor="middle" class="n">reset environment</text><rect x="500" y="78" width="175" height="72" class="b" fill="#edf9f5"/><text x="588" y="108" text-anchor="middle" class="t">Candidate Agent</text><text x="588" y="132" text-anchor="middle" class="n">new prompt / model</text><rect x="500" y="208" width="175" height="72" class="b" fill="#fff7e6"/><text x="588" y="238" text-anchor="middle" class="t">Baseline Agents</text><text x="588" y="262" text-anchor="middle" class="n">prod · previous version</text><rect x="755" y="135" width="175" height="80" class="b" fill="#faf7ff"/><text x="842" y="166" text-anchor="middle" class="t">Trace + Validators</text><text x="842" y="190" text-anchor="middle" class="n">outcome · tool · safety</text><rect x="1000" y="135" width="170" height="80" class="b" fill="#e8f0fe"/><text x="1085" y="166" text-anchor="middle" class="t">Scorecard</text><text x="1085" y="190" text-anchor="middle" class="n">delta · rank · gate</text><path d="M200 175 L265 175 M425 175 L465 175 L465 114 L500 114 M425 175 L465 175 L465 244 L500 244 M675 114 L715 114 L715 175 L755 175 M675 244 L715 244 L715 175 M930 175 L1000 175" class="l"/><text x="1085" y="252" text-anchor="middle" class="n" style="fill:#0b7a5d;font-weight:bold">deploy / investigate / reject</text></svg>
