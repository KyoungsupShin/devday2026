<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">LLM Intelligence</title>
  <desc id="desc">Prompt, Embedding, Reranker 순서의 교육용 응답 품질 개선 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f2fcfa"/>
      <stop offset="1" stop-color="#d9f3ed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#087f73" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect x="52" y="52" width="166" height="42" rx="21" fill="#087f73"/>
  <text x="135" y="80" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">STEP 02</text>
  <text x="52" y="144" fill="#075f57" font-family="Arial, sans-serif" font-size="42" font-weight="700">LLM Intelligence</text>
  <text x="52" y="184" fill="#426d69" font-family="Arial, sans-serif" font-size="22">Design the question, find relevant context, and choose the best answer.</text>
  <g filter="url(#shadow)">
    <rect x="52" y="256" width="288" height="152" rx="20" fill="white"/>
    <rect x="456" y="256" width="288" height="152" rx="20" fill="white"/>
    <rect x="860" y="256" width="288" height="152" rx="20" fill="white"/>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="104" cy="308" r="24" fill="#087f73"/><text x="104" y="316" fill="white" font-size="22" font-weight="700" text-anchor="middle">1</text>
    <text x="148" y="314" fill="#075f57" font-size="27" font-weight="700">Prompt</text><text x="104" y="361" fill="#587b77" font-size="18">Define the question</text>
    <circle cx="508" cy="308" r="24" fill="#087f73"/><text x="508" y="316" fill="white" font-size="22" font-weight="700" text-anchor="middle">2</text>
    <text x="552" y="314" fill="#075f57" font-size="27" font-weight="700">Embedding</text><text x="508" y="361" fill="#587b77" font-size="18">Find relevant context</text>
    <circle cx="912" cy="308" r="24" fill="#087f73"/><text x="912" y="316" fill="white" font-size="22" font-weight="700" text-anchor="middle">3</text>
    <text x="956" y="314" fill="#075f57" font-size="27" font-weight="700">Reranker</text><text x="912" y="361" fill="#587b77" font-size="18">Select the best match</text>
  </g>
  <path d="M355 332h74" stroke="#087f73" stroke-width="5" stroke-linecap="round"/><path d="m416 318 18 14-18 14" fill="none" stroke="#087f73" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M759 332h74" stroke="#087f73" stroke-width="5" stroke-linecap="round"/><path d="m820 318 18 14-18 14" fill="none" stroke="#087f73" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
