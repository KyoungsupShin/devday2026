<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Self-evolving proactive harness cognitive loop</title>
  <desc id="desc">A Meta Cognitive Agent runs two bounded ReAct turns: observation, thinking, action, and evaluation. The first action feeds back into the second turn before the core schedules or waits.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1"><stop stop-color="#0a6ed1"/><stop offset="1" stop-color="#3187d8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1f3854" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d6680"/></marker>
  </defs>
  <rect width="1200" height="510" rx="22" fill="url(#background)"/>
  <text x="52" y="60" fill="#102a43" font-family="Arial, sans-serif" font-size="28" font-weight="700">Self-Evolving Proactive Harness</text>
  <text x="52" y="89" fill="#526b84" font-family="Arial, sans-serif" font-size="16">State &amp; data → ReAct Turn 1 → observation feedback → ReAct Turn 2 → schedule or wait</text>

  <g filter="url(#shadow)">
    <rect x="50" y="146" width="210" height="128" rx="16" fill="#fff" stroke="#cbd8e6"/>
    <rect x="50" y="146" width="210" height="39" rx="16" fill="#e8f2fc"/>
    <text x="72" y="172" fill="#0a5cab" font-family="Arial, sans-serif" font-size="16" font-weight="700">State &amp; Memory</text>
    <text x="72" y="210" fill="#334e68" font-family="Arial, sans-serif" font-size="14">Goals · tasks · observations</text>
    <text x="72" y="237" fill="#334e68" font-family="Arial, sans-serif" font-size="14">Memory · reflection · wake-up</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="50" y="326" width="210" height="104" rx="16" fill="#fff" stroke="#cbd8e6"/>
    <rect x="50" y="326" width="210" height="39" rx="16" fill="#eef7ed"/>
    <text x="72" y="352" fill="#2d6a36" font-family="Arial, sans-serif" font-size="16" font-weight="700">Data observation</text>
    <text x="72" y="392" fill="#334e68" font-family="Arial, sans-serif" font-size="14">Existing Work Agents</text>
    <text x="72" y="415" fill="#334e68" font-family="Arial, sans-serif" font-size="14">Read-only Tools</text>
  </g>

  <path d="M260 210 C290 210 300 210 330 210" fill="none" stroke="#4d6680" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M260 378 C300 378 290 292 330 265" fill="none" stroke="#4d6680" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="334" y="133" width="260" height="190" rx="18" fill="url(#core)"/>
    <text x="364" y="177" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">ReAct Turn 1</text>
    <line x1="364" y1="194" x2="560" y2="194" stroke="#fff" stroke-opacity=".45"/>
    <text x="364" y="225" fill="#fff" font-family="Arial, sans-serif" font-size="14">Observation → Thinking</text>
    <text x="364" y="250" fill="#fff" font-family="Arial, sans-serif" font-size="14">Action → Evaluation</text>
    <text x="364" y="275" fill="#fff" font-family="Arial, sans-serif" font-size="14">Result becomes evidence</text>
  </g>
  <path d="M594 228 L658 228" fill="none" stroke="#4d6680" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="662" y="155" width="218" height="146" rx="16" fill="#fff" stroke="#9fc3e7" stroke-width="2"/>
    <text x="688" y="193" fill="#0a5cab" font-family="Arial, sans-serif" font-size="17" font-weight="700">Observation feedback</text>
    <text x="688" y="225" fill="#334e68" font-family="Arial, sans-serif" font-size="14">Task result · new evidence</text>
    <text x="688" y="250" fill="#334e68" font-family="Arial, sans-serif" font-size="14">Hypothesis · problem update</text>
    <text x="688" y="275" fill="#526b84" font-family="Arial, sans-serif" font-size="13">Validated, read-only outcome</text>
  </g>
  <path d="M880 228 L940 228" fill="none" stroke="#4d6680" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="944" y="135" width="206" height="186" rx="16" fill="#fff" stroke="#cbd8e6"/>
    <text x="969" y="177" fill="#394b59" font-family="Arial, sans-serif" font-size="17" font-weight="700">ReAct Turn 2</text>
    <text x="969" y="211" fill="#334e68" font-family="Arial, sans-serif" font-size="14">Observation → Thinking</text>
    <text x="969" y="236" fill="#334e68" font-family="Arial, sans-serif" font-size="14">Action → Evaluation</text>
    <text x="969" y="261" fill="#334e68" font-family="Arial, sans-serif" font-size="14">WAIT · approval · follow-up</text>
    <text x="969" y="286" fill="#334e68" font-family="Arial, sans-serif" font-size="14">Persist next wake-up</text>
  </g>
  <path d="M1047 321 C1047 441 646 451 470 350" fill="none" stroke="#4d6680" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="656" y="462" fill="#526b84" font-family="Arial, sans-serif" font-size="14">Evaluation updates memory; terminal decisions schedule the next wake-up</text>
</svg>
