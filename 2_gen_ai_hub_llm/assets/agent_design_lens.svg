<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-label="Prompt와 모델 학습 흐름">
  <defs><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#0b4d8d" flood-opacity=".14"/></filter></defs>
  <rect width="1600" height="900" rx="28" fill="#eaf5ff"/>
  <rect x="58" y="70" width="235" height="58" rx="29" fill="#1474d4"/><text x="176" y="109" text-anchor="middle" fill="#fff" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700">PROMPT &amp; MODEL</text>
  <text x="58" y="210" fill="#103c70" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="55" font-weight="700">Prompt와 모델로 Agent 설계하기</text>
  <text x="58" y="270" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="27">System prompt, message history, 모델 비교, ReAct 도구 호출을 연결해 응답을 설계합니다.</text>
  <g filter="url(#shadow)" fill="#fff"><rect x="45" y="395" width="210" height="280" rx="25"/><rect x="305" y="395" width="210" height="280" rx="25"/><rect x="565" y="395" width="210" height="280" rx="25"/><rect x="825" y="395" width="210" height="280" rx="25"/><rect x="1085" y="395" width="210" height="280" rx="25"/><rect x="1345" y="395" width="210" height="280" rx="25"/></g>
  <g fill="none" stroke="#1474d4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M268 535h23m-11-15 16 15-16 15"/><path d="M528 535h23m-11-15 16 15-16 15"/><path d="M788 535h23m-11-15 16 15-16 15"/><path d="M1048 535h23m-11-15 16 15-16 15"/><path d="M1308 535h23m-11-15 16 15-16 15"/></g>
  <!-- 1 System prompt -->
  <circle cx="78" cy="454" r="25" fill="#1474d4"/><text x="78" y="463" text-anchor="middle" fill="#fff" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700">1</text><text x="150" y="506" text-anchor="middle" fill="#103c70" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700">System Prompt</text><text x="70" y="557" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">역할 · 규칙 · 언어</text><text x="70" y="584" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">출력 형식</text><line x1="70" y1="610" x2="230" y2="610" stroke="#d7e8fa" stroke-width="2"/><text x="70" y="646" fill="#6c89a8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16">응답 기준을 정의</text>
  <!-- 2 roles -->
  <circle cx="338" cy="454" r="25" fill="#1474d4"/><text x="338" y="463" text-anchor="middle" fill="#fff" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700">2</text><text x="410" y="506" text-anchor="middle" fill="#103c70" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700">Message Roles</text><text x="330" y="557" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">system · user</text><text x="330" y="584" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">assistant</text><line x1="330" y1="610" x2="490" y2="610" stroke="#d7e8fa" stroke-width="2"/><text x="330" y="646" fill="#6c89a8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16">역할 있는 배열 구성</text>
  <!-- 3 history -->
  <circle cx="598" cy="454" r="25" fill="#1474d4"/><text x="598" y="463" text-anchor="middle" fill="#fff" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700">3</text><text x="670" y="506" text-anchor="middle" fill="#103c70" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700">History Context</text><text x="590" y="557" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">최근 12개 메시지</text><text x="590" y="584" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">총 12,000자</text><line x1="590" y1="610" x2="750" y2="610" stroke="#d7e8fa" stroke-width="2"/><text x="590" y="646" fill="#6c89a8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16">필요한 맥락 유지</text>
  <!-- 4 JSON -->
  <circle cx="858" cy="454" r="25" fill="#1474d4"/><text x="858" y="463" text-anchor="middle" fill="#fff" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700">4</text><text x="930" y="506" text-anchor="middle" fill="#103c70" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700">JSON Output</text><text x="850" y="557" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">JSON 형식 요청</text><text x="850" y="584" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">파싱 검증</text><line x1="850" y1="610" x2="1010" y2="610" stroke="#d7e8fa" stroke-width="2"/><text x="850" y="646" fill="#6c89a8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16">구조화된 응답 확인</text>
  <!-- 5 model -->
  <circle cx="1118" cy="454" r="25" fill="#1474d4"/><text x="1118" y="463" text-anchor="middle" fill="#fff" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700">5</text><text x="1190" y="506" text-anchor="middle" fill="#103c70" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700">Model Comparison</text><text x="1110" y="557" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">응답 시간 · 정확성</text><text x="1110" y="584" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">지시 준수</text><line x1="1110" y1="610" x2="1270" y2="610" stroke="#d7e8fa" stroke-width="2"/><text x="1110" y="646" fill="#6c89a8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16">목적에 맞게 선택</text>
  <!-- 6 ReAct -->
  <circle cx="1378" cy="454" r="25" fill="#1474d4"/><text x="1378" y="463" text-anchor="middle" fill="#fff" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700">6</text><text x="1450" y="506" text-anchor="middle" fill="#103c70" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700">ReAct Agent</text><text x="1370" y="557" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">계산 도구 호출</text><text x="1370" y="584" fill="#466b90" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18">결과를 답변에 반영</text><line x1="1370" y1="610" x2="1530" y2="610" stroke="#d7e8fa" stroke-width="2"/><text x="1370" y="646" fill="#6c89a8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16">질문에 따라 행동</text>
  
</svg>
