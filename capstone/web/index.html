<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>재고 에이전트 캡스톤</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
<style>
  :root{ --bg:#f4f6f9; --card:#fff; --fg:#1a1a1a; --muted:#5b6671; --border:#e3e8ee;
         --accent:#0a6ed1; --accent2:#107e3e; --code:#f6f8fa; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0f1115; --card:#161a20; --fg:#e6e8eb; --muted:#9aa4af;
         --border:#2a2f37; --accent:#4aa3ff; --accent2:#5bbd7a; --code:#0f1318; } }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:1.5rem;margin:.2em 0} .sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);
    cursor:pointer;text-align:center;font-weight:600}
  .tab.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
  .tab small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:3px}
  textarea{width:100%;min-height:70px;padding:12px;border:1px solid var(--border);border-radius:10px;
    background:var(--card);color:var(--fg);font-size:.95rem;font-family:inherit;resize:vertical}
  .sel{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);
    color:var(--fg);font-size:.9rem;font-family:inherit;margin-bottom:8px;cursor:pointer}
  .run{margin-top:10px;padding:12px 20px;border:none;border-radius:10px;background:var(--accent);color:#fff;
    font-weight:600;cursor:pointer;font-size:.95rem} .run:disabled{opacity:.5;cursor:default}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:16px}
  .card h3{margin:.1em 0 .6em;font-size:1rem}
  .trace{list-style:none;padding:0;margin:0}
  .step{border-left:3px solid var(--accent2);padding:6px 0 6px 12px;margin:0 0 6px}
  .step .t{font-weight:600;color:var(--accent2)} .step .o{color:var(--muted);font-size:.85rem;white-space:pre-wrap}
  .cycle{display:flex;align-items:stretch;gap:4px;margin:12px 0;flex-wrap:wrap}
  .ph{flex:1;text-align:center;padding:12px 4px;border:1px solid var(--border);border-radius:12px;background:var(--card);
    color:var(--muted);font-size:.85rem;font-weight:600;transition:all .3s}
  .ph .ic{font-size:1.5rem;display:block;margin-bottom:4px;filter:grayscale(.6);opacity:.6;transition:all .3s}
  .ph .phd{font-size:.68rem;font-weight:400;color:var(--muted);margin-top:3px}
  .ph.on{border-color:var(--accent);color:var(--accent);transform:translateY(-3px);
    box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 28%,transparent)}
  .ph.on .ic{filter:none;opacity:1;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.2)}}
  .arr{align-self:center;color:var(--muted);font-size:1.15rem;font-weight:700}
  .loopn{font-size:.82rem;color:var(--accent);font-weight:700}
  .thought{margin:8px 0;padding:9px 12px;background:var(--accent-soft);border:1px solid var(--border);
    border-radius:8px;font-size:.88rem;font-style:italic;line-height:1.5}
  .tstep{border-left-color:#a06cd5 !important}
  .tstep .th{font-style:italic;color:var(--fg);font-size:.88rem}
  .bar{height:10px;background:var(--border);border-radius:6px;overflow:hidden;margin:8px 0}
  .bar > i{display:block;height:100%;border-radius:6px;transition:width .4s ease;
    background:linear-gradient(90deg,var(--accent),var(--accent2));background-size:200% 100%;animation:flow 1.1s linear infinite}
  @keyframes flow{to{background-position:200% 0}}
  .pstat{font-size:.9rem;margin:4px 0}
  .plog{list-style:none;padding:0;margin:8px 0 0;font-size:.82rem}
  .plog li{padding:3px 0;border-bottom:1px dashed var(--border)}
  details.card summary{cursor:pointer;font-weight:600;font-size:.92rem;color:var(--accent)}
  details.card[open] summary{margin-bottom:8px}
  .md table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:.9rem;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--border);padding:6px 10px} .md th{background:var(--code)}
  .md code{background:var(--code);padding:.1em .3em;border-radius:4px}
  .ex{color:var(--muted);font-size:.82rem;margin-top:6px} .ex b{color:var(--fg)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;
    border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px} @keyframes s{to{transform:rotate(360deg)}}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  @media (max-width:640px){ .cmp{grid-template-columns:1fr} .tabs{flex-wrap:wrap} }
  .pane{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--bg)}
  .pane h4{margin:.1em 0 .5em;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .codeblk{background:var(--code);padding:12px;border-radius:8px;overflow-x:auto;font-size:.78rem;
    line-height:1.45;white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:8px}
  .jsonblk{background:var(--code);padding:12px;border-radius:8px;overflow-x:auto;font-size:.82rem;
    white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .badge{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;
    background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);margin-left:6px}
  .badge.sdk{background:color-mix(in srgb,#a06cd5 18%,transparent);color:#a06cd5}
  .advhint{color:var(--muted);font-size:.85rem;margin:.3em 0 .2em;line-height:1.5}
  .invoice{max-width:100%;border:1px solid var(--border);border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const API = "";  // 같은 오리진(FastAPI가 UI까지 서빙)

// 예시 프롬프트(리스트박스) — value가 실제 전송 문구
const PRESETS_A = [
  {label:"① 기본 — 재고 점검·발주 품목 정리", value:"재고를 점검하고 발주가 필요한 품목과 권장 수량을 정리해줘."},
  {label:"② 현재 재고 상태만 요약", value:"현재 재고 상태만 요약해줘."},
  {label:"③ 수입품만 환율 기준 발주 여부", value:"수입 품목만 골라 환율을 기준으로 발주가 필요한지 알려줘."},
];
const PRESETS_B = [
  {label:"① 기본 — 비용 최소화 발주 계획", value:"품절 없이 비용 최소화로 발주 계획을 세워줘. 수입품은 환율과 정책 반영. 필요한 발주는 초안으로 생성."},
  {label:"② 없는 역량 유발 — 수요예측·날씨 반영 (need_info)", value:"품절 없이 비용 최소화로 발주하되, 다음 달 수요예측과 날씨(물류 지연)도 반영해줘. 필요한 발주는 초안으로 생성."},
  {label:"③ 없는 역량 유발 — 경쟁사 가격 비교 (need_info)", value:"외부 경쟁사 현재 시세와 비교해 더 싼 공급처가 있으면 반영해서 발주해줘."},
  {label:"④ 예산 제약 — 급한 품목만", value:"예산 300만원 내에서 가장 급한 품목만 발주 초안으로 만들어줘."},
  {label:"⑤ 환율 민감 — 불리하면 보류", value:"수입품 환율이 불리하면 발주를 보류하고 그 이유를 설명해줘."},
];

// 도구명 → 엔드유저용 쉬운 말
const TOOL_LABEL = {
  get_inventory: "📦 재고 확인",
  get_suppliers: "🏭 공급사 조회",
  get_fx:        "💱 환율 확인",
  search_policy: "📑 사내 정책 검토",
  draft_reorder: "📝 발주 초안 작성",
  need_info:     "❓ 추가 정보 요청",
};
const label = t => TOOL_LABEL[t] || t;

function Md({text}){ return <div className="md" dangerouslySetInnerHTML={{__html: marked.parse(text||"")}} />; }
function Code({text}){ return <pre className="codeblk">{text}</pre>; }
function Json({obj}){ return <pre className="jsonblk">{JSON.stringify(obj,null,2)}</pre>; }

// 스트리밍은 SSE라 서버가 코드를 못 돌려줘서 클라이언트에 둠(advanced.py _STREAM_CODE 와 동일)
const STREAM_CODE =
`from gen_ai_hub.orchestration_v2.models.streaming import GlobalStreamOptions
cfg = OrchestrationConfig(modules=..., stream=GlobalStreamOptions(enabled=True))
for chunk in svc.stream(config=cfg, placeholder_values={"topic": topic}):
    delta = chunk.final_result.choices[0].delta.content
    if delta:
        yield delta           # 한 조각씩 화면에 출력`;

// ─────────────── 심화 데모: 본편 미사용 Orchestration 기능 4종 ───────────────
function Advanced(){
  const [rfReq,setRfReq]=useState("A 품목이 안전재고 미만이라 S1에서 긴급 발주해야 함");
  const [rf,setRf]=useState(null),[rfL,setRfL]=useState(false);
  async function runRF(){ setRfL(true); setRf(null);
    try{ const r=await fetch("/api/adv/response-format",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({req:rfReq})});
      if(!r.ok) throw new Error("HTTP "+r.status); setRf(await r.json()); }
    catch(e){ setRf({error:String(e)}); } finally{ setRfL(false); } }

  const [stTopic,setStTopic]=useState("재고 자율 에이전트의 장점");
  const [stTxt,setStTxt]=useState(""),[stL,setStL]=useState(false),[stDone,setStDone]=useState(false);
  async function runStream(){ setStL(true); setStTxt(""); setStDone(false);
    try{
      const r=await fetch("/api/adv/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topic:stTopic})});
      const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
      while(true){ const {value,done}=await reader.read(); if(done)break;
        buf+=dec.decode(value,{stream:true}); let i;
        while((i=buf.indexOf("\n\n"))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
          if(!line.startsWith("data:"))continue; const ev=JSON.parse(line.slice(5).trim());
          if(ev.delta) setStTxt(t=>t+ev.delta); } }
      setStDone(true);
    }catch(e){ setStTxt("오류: "+e); } finally{ setStL(false); } }

  const [tr,setTr]=useState(null),[trL,setTrL]=useState(false);
  async function runTr(){ setTrL(true); setTr(null);
    try{ const r=await fetch("/api/adv/translation",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({})});
      if(!r.ok) throw new Error("HTTP "+r.status); setTr(await r.json()); }
    catch(e){ setTr({error:String(e)}); } finally{ setTrL(false); } }

  const [mm,setMm]=useState(null),[mmL,setMmL]=useState(false);
  async function runMm(){ setMmL(true); setMm(null);
    try{ const r=await fetch("/api/adv/multimodal",{method:"POST"});
      if(!r.ok) throw new Error("HTTP "+r.status); setMm(await r.json()); }
    catch(e){ setMm({error:String(e)}); } finally{ setMmL(false); } }

  return <div>
    <div className="advhint">본편(모드 A·B)에서 <b>쓰지 않은</b> Orchestration 기능 4종입니다. 버튼으로 직접 실행해 결과와 <b>실제 SDK 코드</b>를 확인하세요. 모두 같은 AI Core · gpt-5.6-sol 사용.</div>

    <div className="card">
      <h3>1. Response Format <span className="badge sdk">UI 불가 · SDK 전용</span></h3>
      <div className="advhint">같은 요청을 <b>자유 텍스트</b> vs <b>JSON 스키마 강제</b>로 각각 생성. 스키마를 강제하면 항상 같은 구조 → <b>CAP POST로 바로 연결</b> 가능.</div>
      <textarea value={rfReq} onChange={e=>setRfReq(e.target.value)} />
      <button className="run" onClick={runRF} disabled={rfL}>{rfL?<><span className="spin"></span>실행 중…</>:"실행"}</button>
      {rf && rf.error && <div className="advhint" style={{color:"#c33"}}>오류: {rf.error}</div>}
      {rf && !rf.error && <><div className="cmp">
        <div className="pane"><h4>자유 텍스트 (스키마 없음)</h4><Md text={rf.free_text}/></div>
        <div className="pane"><h4>JSON 스키마 강제 ✅</h4><Json obj={rf.json_result}/></div></div>
        <Code text={rf.code}/></>}
    </div>

    <div className="card">
      <h3>2. Streaming (토큰) <span className="badge sdk">UI 불가 · SDK 전용</span></h3>
      <div className="advhint"><code>svc.run()</code>(한 번에) 대신 <code>svc.stream()</code> — 답을 <b>조각(delta)으로 실시간</b> 출력. "LLM이 쓰는 중" 효과.</div>
      <textarea value={stTopic} onChange={e=>setStTopic(e.target.value)} />
      <button className="run" onClick={runStream} disabled={stL}>{stL?<><span className="spin"></span>스트리밍 중…</>:"실행"}</button>
      {(stTxt||stL) && <div className="pane" style={{marginTop:10}}><h4>실시간 출력{stL?" ▍":""}</h4><Md text={stTxt}/></div>}
      {stDone && <Code text={STREAM_CODE}/>}
    </div>

    <div className="card">
      <h3>3. Translation <span className="badge">UI·SDK 공통</span></h3>
      <div className="advhint">LLM은 <b>영어</b>로 답하게 하고, Orchestration <b>번역 모듈</b>이 출력만 한국어로 자동 변환(en→ko).</div>
      <button className="run" onClick={runTr} disabled={trL}>{trL?<><span className="spin"></span>실행 중…</>:"실행"}</button>
      {tr && tr.error && <div className="advhint" style={{color:"#c33"}}>오류: {tr.error}</div>}
      {tr && !tr.error && <><div className="cmp">
        <div className="pane"><h4>번역 모듈 OFF — 영어 원문</h4><Md text={tr.english}/></div>
        <div className="pane"><h4>번역 모듈 ON — 한국어 ✅</h4><Md text={tr.korean}/></div></div>
        <Code text={tr.code}/></>}
    </div>

    <div className="card">
      <h3>4. Multimodal (이미지 입력) <span className="badge sdk">UI 불가 · SDK 전용</span></h3>
      <div className="advhint">텍스트 대신 <b>이미지(송장)</b>를 모델에 입력 → "보고" 품목·수량·금액을 읽어 <b>구조화 JSON</b>으로 추출(= OCR + 의미 이해).</div>
      <div className="cmp"><div className="pane"><h4>입력 이미지 (샘플 송장)</h4>
        <img className="invoice" src="/api/adv/invoice" alt="sample invoice"/></div>
        <div className="pane"><h4>추출 결과 (JSON)</h4>
          {mm && !mm.error && mm.supported && <Json obj={mm.extracted}/>}
          {mm && mm.supported===false && <div className="advhint" style={{color:"#c33"}}>모델 비전 미지원/오류: {mm.error}</div>}
          {mm && mm.error && <div className="advhint" style={{color:"#c33"}}>오류: {mm.error}</div>}
          {!mm && <div className="advhint">실행하면 추출됩니다.</div>}</div></div>
      <button className="run" onClick={runMm} disabled={mmL}>{mmL?<><span className="spin"></span>이미지 읽는 중…</>:"실행"}</button>
      {mm && mm.code && <Code text={mm.code}/>}
    </div>
  </div>;
}

function App(){
  const [mode,setMode]=useState("B");
  const [goal,setGoal]=useState("품절 없이 비용 최소화로 발주 계획을 세워줘. 수입품은 환율과 정책 반영.");
  const [instr,setInstr]=useState("재고를 점검하고 발주가 필요한 품목과 권장 수량을 정리해줘.");
  const [loading,setLoading]=useState(false);
  const [res,setRes]=useState(null);
  const [err,setErr]=useState(null);
  const [prog,setProg]=useState(null);   // 진행 상태(모드 B 스트리밍)

  function run(){ setErr(null); setRes(null); mode==="A" ? runA() : runB(); }

  async function runA(){            // 제한형: 단일 라운드(블로킹)
    setLoading(true);
    try{
      const r = await fetch("/api/mode-a",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:instr})});
      if(!r.ok) throw new Error("HTTP "+r.status);
      setRes(await r.json());
    }catch(e){ setErr(String(e)); } finally{ setLoading(false); }
  }

  async function runB(){            // 자율형: 스트리밍(단계 루프 표시)
    setLoading(true); setProg({turn:0,max:8,phase:"reason",tool:null,steps:[]});
    try{
      const r = await fetch("/api/mode-b/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({goal})});
      const reader=r.body.getReader(), dec=new TextDecoder(); let buf="";
      while(true){
        const {value,done}=await reader.read(); if(done) break;
        buf+=dec.decode(value,{stream:true}); let i;
        while((i=buf.indexOf("\n\n"))>=0){
          const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
          if(!line.startsWith("data:")) continue;
          const ev=JSON.parse(line.slice(5).trim());
          if(ev.event==="start") setProg(p=>({...p,max:ev.max_iter}));
          else if(ev.event==="phase"){
            if(ev.phase==="reason") setProg(p=>({...p,turn:ev.turn,phase:"reason",tool:null,tools:null,thought:null}));
            else if(ev.phase==="select") setProg(p=>({...p,phase:"select",tools:ev.tools}));
            else if(ev.phase==="act") setProg(p=>({...p,phase:"act",tool:ev.tool}));
            else if(ev.phase==="observe") setProg(p=>({...p,phase:"observe",tool:ev.tool,steps:[...p.steps,{tool:ev.tool,observation:ev.observation}]}));
          }
          else if(ev.event==="thought") setProg(p=>({...p,thought:ev.text}));
          else if(ev.event==="done") setRes({mode:"B-autonomous",goal,trace:ev.trace,drafts:ev.drafts,needs:ev.needs,answer:ev.answer});
        }
      }
    }catch(e){ setErr(String(e)); } finally{ setLoading(false); setProg(null); }
  }

  return <div className="wrap">
    <h1>재고 에이전트 캡스톤</h1>
    <div className="sub">AI Core Orchestration(두뇌) + 도구(재고·공급사·환율·정책) · 고정형 vs 목표지향 자율형</div>

    <div className="tabs">
      <div className={"tab"+(mode==="A"?" active":"")} onClick={()=>setMode("A")}>
        모드 A · 제한형<small>도구를 한 번 선택 · 반복 없음</small></div>
      <div className={"tab"+(mode==="B"?" active":"")} onClick={()=>setMode("B")}>
        모드 B · 목표지향 자율형<small>목표만 주면 스스로 도구 선택·반복</small></div>
      <div className={"tab"+(mode==="ADV"?" active":"")} onClick={()=>setMode("ADV")}>
        심화 데모<small>본편 미사용 기능 4종</small></div>
    </div>

    {mode==="ADV" && <Advanced/>}

    {mode!=="ADV" && <>
    <select className="sel" value=""
      onChange={e=>{ if(!e.target.value) return;
        mode==="A" ? setInstr(e.target.value) : setGoal(e.target.value); }}>
      <option value="">📋 예시 프롬프트 선택…</option>
      {(mode==="A"?PRESETS_A:PRESETS_B).map((p,i)=><option key={i} value={p.value}>{p.label}</option>)}
    </select>

    {mode==="A"
      ? <><textarea value={instr} onChange={e=>setInstr(e.target.value)} />
          <div className="ex">LLM이 도구를 <b>한 번</b> 선택해 수행(반복 없음)</div></>
      : <><textarea value={goal} onChange={e=>setGoal(e.target.value)} />
          <div className="ex">에이전트가 재고·정책·환율·공급사를 알아서 조회·판단 · <b>②③</b>은 도구에 없는 정보를 <b>need_info</b>로 요청</div></>}

    <button className="run" onClick={run} disabled={loading}>
      {loading ? <><span className="spin"></span>실행 중…</> : "실행"}</button>

    {err && <div className="card" style={{borderColor:"#c33"}}>오류: {err} <br/><small>API(8099)가 떠 있는지 확인</small></div>}

    {loading && mode==="B" && prog &&
      <div className="card"><h3>🔁 에이전트 루프 <span className="loopn">↺ {prog.turn||1}회차</span></h3>
        <div className="cycle">
          {[["reason","🧠","LLM 추론","Orchestration 호출"],
            ["select","🎯","도구 선택","쓸 도구·인자 결정"],
            ["act","🔧","도구 실행","함수 호출"],
            ["observe","🔄","결과 되먹임","맥락에 추가→다음 추론"]].map(([ph,ic,t,d],i)=>
            <React.Fragment key={ph}>
              <div className={"ph"+(prog.phase===ph?" on":"")}>
                <span className="ic">{ic}</span>{t}<div className="phd">{d}</div>
              </div>
              <span className="arr">{i<3 ? "→" : "↺"}</span>
            </React.Fragment>)}
        </div>
        <div className="bar"><i style={{width: Math.min(Math.round((prog.turn||0)/prog.max*100),95)+"%"}}></i></div>
        <div className="pstat">현재: <b>{
          prog.phase==="reason" ? "🧠 LLM 추론 — Orchestration이 다음 행동을 생각하는 중…"
          : prog.phase==="select" ? ("🎯 도구 선택 — "+(prog.tools||[]).map(label).join(", "))
          : prog.phase==="act" ? ("🔧 도구 실행 — "+label(prog.tool)+" 호출 중…")
          : ("🔄 결과 되먹임 — "+label(prog.tool)+" 결과를 맥락에 추가")}</b></div>
        {prog.thought && <div className="thought">💭 생각: {prog.thought}</div>}
        {prog.steps.length>0 &&
          <ul className="plog">{prog.steps.slice(-5).map((s,i)=>
            <li key={i}>✅ <b>{label(s.tool)}</b></li>)}</ul>}
      </div>}

    {res && res.trace && res.trace.length>0 &&
      <details className="card"><summary>🔎 에이전트 진행 상세 (trace · {res.trace.length}단계) — 펼쳐 보기</summary>
        <ol className="trace">{res.trace.map((s,i)=>
          s.thought
          ? <li className="step tstep" key={i}><div className="th">💭 {s.thought}</div></li>
          : <li className="step" key={i}>
              <div className="t">{label(s.tool)} <span style={{color:"var(--muted)",fontWeight:400,fontSize:".8em"}}>({s.tool} · {JSON.stringify(s.args)})</span></div>
              <div className="o">👀 {s.observation}</div>
            </li>)}</ol></details>}

    {res && res.drafts && res.drafts.length>0 &&
      <div className="card"><h3>📝 생성된 발주 초안 (에이전트 행동 · 승인 대기)</h3>
        <table className="md"><thead><tr><th>품목</th><th>수량</th><th>공급사</th><th>상태</th><th>근거</th></tr></thead>
          <tbody>{res.drafts.map((d,i)=>
            <tr key={i}><td>{d.item}</td><td>{d.qty}</td><td>{d.supplier||"-"}</td><td>{d.status}</td><td>{d.reason||"-"}</td></tr>)}
          </tbody></table></div>}

    {res && res.needs && res.needs.length>0 &&
      <div className="card" style={{borderColor:"var(--accent)"}}>
        <h3>🧩 에이전트가 요청한 '없는 역량' (다음에 만들 도구)</h3>
        <ul>{res.needs.map((n,i)=><li key={i}><b>{n.topic}</b>{n.reason?` — ${n.reason}`:""}</li>)}</ul>
        <div className="ex">LLM이 과업 중 필요로 했으나 도구가 없던 것 = <b>개발 백로그(공짜 요구사항 피드백)</b></div>
      </div>}

    {res && <div className="card"><h3>✅ 결과 {res.mode && <small style={{color:"var(--muted)"}}>({res.mode})</small>}</h3>
      <Md text={res.answer} /></div>}
    </>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
